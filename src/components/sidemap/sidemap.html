@if (sections().length > 0) {
  <aside class="flex flex-col gap-3 w-44 shrink-0 sticky top-20 self-start mb-8 ml-16">
    <app-liquid-glass styleClass="py-8 px-4 h-[calc(100dvh-100px)] flex flex-col gap-2">
      <p class="text-xs uppercase tracking-widest mb-1">On this page</p>

      <nav class="flex flex-col gap-2">
        @for (link of sections(); track link.href) {
          <a
            key="{link.href}"
            [href]="link.href"
            pButton
            variant="text"
            (click)="$event.preventDefault(); scrollTo(link)"
            class="flex justify-start text-muted-foreground px-2 py-1 rounded-xl w-full text-sm hover:bg-accent/10 transition-colors duration-200"
            [class]="isActive(link) ? 'text-accent! font-semibold bg-accent/10' : ''"
          >
            @if (link.icon) {
              <svg
                [pIcon]="link.icon"
                [color]="isActive(link) ? 'accent' : 'muted-foreground'"
              ></svg>
            }
            {{ link.label }}
          </a>
        }
      </nav>
    </app-liquid-glass>
  </aside>
}

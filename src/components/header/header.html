<header class="fixed top-0 inset-x-0 z-15 bg-background/90 backdrop-blur-sm border-b border-border">
  <div class="px-4 md:px-14 h-14 flex items-center justify-between">
    <div class="left">
      <a pButton class="font-serif" link href="/">MC</a>
    </div>
    <nav class="hidden md:flex items-center gap-1">
      @for (nav of PAGES(); track nav.href) {
        <a
          class="px-3 py-1.5 text-sm rounded-md transition-colors text-muted-foreground hover:text-foreground"
          [class]="isActive(nav) ? 'font-medium! text-foreground!' : ''"
          [routerLink]="nav.href"
        >
          {{ nav.label }}
        </a>
      }
    </nav>
    <div class="right">
      <div class="flex items-center gap-3">
        <button
          class="hover:text-accent transition-colors p-1"
          aria-label="Toggle dark mode"
          pButton
          (click)="toggleDarkMode()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-sun"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </button>
        <!-- <div class="block md:hidden"> -->
        <button pButton (click)="mobileNavVisible.update((v) => !v)">
          <svg data-p-icon="bars"></svg>
        </button>
        <!-- </div> -->
      </div>
    </div>
  </div>
</header>

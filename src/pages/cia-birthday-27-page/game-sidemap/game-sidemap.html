<aside class="flex flex-col h-full pt-20">
  <app-liquid-glass styleClass="py-8 px-1 flex flex-col gap-2 min-h-120 w-60 xl:w-75">
    <p class="text-xs uppercase tracking-widest mb-1 px-1">Current Leaderboard</p>

    @for (result of results(); track result.name; let i = $index) {
      <div
        class="flex gap-2 justify-between p-1 rounded-xl"
        [class]="i === 0 ? 'bg-accent/20' : ''"
      >
        <span class="truncate"> {{ i + 1 }}. {{ i === 0 ? '👑' : '' }} {{ result.name }}</span>
        <span class="w-3/10 text-end">{{ result.totalInMs / 1000 }}s </span>
      </div>
    }
  </app-liquid-glass>
</aside>

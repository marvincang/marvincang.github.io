<article
  class="flex flex-row border border-border bg-card overflow-hidden rounded-xl"
  style="box-shadow: rgba(0, 0, 12, 0.35) 0px 1px 16px; opacity: 1; transform: none"
>
  <div class="w-1/2 aspect-1 bg-muted overflow-hidden">
    <img [src]="post().image" [alt]="`${post().name}'s birthday wish" class="w-full object-cover" />
  </div>
  <div class="flex flex-col gap-3 p-5">
    <div class="flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold truncate">{{ post().name }}</p>
        <p class="text-xs text-muted-foreground font-mono">{{ getHoursAgo(post().createdAt) }}</p>
      </div>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-cake text-accent shrink-0"
      >
        <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"></path>
        <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"></path>
        <path d="M2 21h20"></path>
        <path d="M7 8v3"></path>
        <path d="M12 8v3"></path>
        <path d="M17 8v3"></path>
        <path d="M7 4h.01"></path>
        <path d="M12 4h.01"></path>
        <path d="M17 4h.01"></path>
      </svg>
    </div>
    <p class="text-sm leading-relaxed text-foreground/85">
      {{ post().message }}
    </p>
    <div class="flex items-center justify-between pt-1 border-t border-border"></div>
  </div>
</article>
